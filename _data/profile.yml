about_title: "Hands-on on the ramp. Rigorous about quality."
about:
  - "Every departure depends on the work done on the ground. Before an aircraft carries a single passenger, it must be inspected, its defects rectified and its records complete; one missed detail on the line can compromise safety and ground an aircraft. Since 2013, that has been my work: scheduled and unscheduled inspections, troubleshooting, snag rectification and component changes, backed by the spares, documentation and audits that make every release safe and on time."
  - "At Air India in Jammu, I work on the Airbus A320ceo/neo and the Boeing 737 MAX. I support AOG (aircraft on ground) recoveries, supervise shifts and rosters, run engineering stores as the Designated Stores Officer, plan ground support equipment, and prepare the station for regulatory audits. Since May 2026, I have also been an approved instructor for headset communication, marshalling and ramp safety."
  - "In 2013, I joined GoAir as a Junior Aircraft Maintenance Technician. Over the next eleven years, I rose through every technician grade to Master Aircraft Maintenance Technician, staying on through the airline’s change of name to GO FIRST. GoAir named me its Best Engineering Employee of the Quarter (Sep–Dec 2013). I then worked on SpiceJet’s Boeing 737 and Bombardier Q400 fleet, before moving to Air India in 2024."
  - "Alongside the job, I have kept studying: a B.Tech in Aeronautics; an M.Tech in Quality Assurance from BITS Pilani’s Work Integrated Learning Programmes; Lean Six Sigma up to Master Black Belt; and TÜV SÜD’s AS9100D Internal Auditor course."
  - "I speak English, Hindi and Kashmiri, as well as some Punjabi. Outside work, I read technical books, follow developments in artificial intelligence, and have been a member of the Delhi Astronomy Club since 2020."

